# 책 15장: pip install langchain langgraph langchain-openai
# research_team.py(7·8·12장 코드)와 도구 본문(7장)에 openai, python-dotenv, ddgs, trafilatura가 더 필요합니다.
[project]
name = "ch15-frameworks"
version = "0.1.0"
description = "문제 해결을 위한 AI 에이전트 설계 15장 예제"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-openai>=1.7",
    "openai>=2.54",
    "python-dotenv>=1.0",
    "ddgs>=9.16",
    "trafilatura>=2.3",
]

[tool.uv]
package = false

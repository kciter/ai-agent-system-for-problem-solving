# 책 13장에는 pip 줄이 없습니다. plugins/web_tools.py가 7장의 도구를 쓰므로 7장과 같습니다.
# 책 7장: pip install openai python-dotenv ddgs trafilatura
[project]
name = "ch13-plugin-architecture"
version = "0.1.0"
description = "문제 해결을 위한 AI 에이전트 설계 13장 예제"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.54",
    "python-dotenv>=1.0",
    "ddgs>=9.16",
    "trafilatura>=2.3",
]

[tool.uv]
package = false
